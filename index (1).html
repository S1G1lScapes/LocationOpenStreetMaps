<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>loco · live tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c0f;
    --surface: #13161b;
    --border: #1e2229;
    --accent: #00e57a;
    --accent-dim: #00994f;
    --text: #e8eaed;
    --muted: #5a6070;
    --danger: #ff4d4d;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
  }

  #app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    gap: 12px;
  }

  .logo {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent);
  }

  .logo span {
    color: var(--muted);
    font-weight: 400;
  }

  #status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
    transition: all 0.3s;
  }

  #status-pill.live {
    color: var(--accent);
    border-color: var(--accent-dim);
    background: rgba(0,229,122,0.06);
  }

  #status-pill.error {
    color: var(--danger);
    border-color: rgba(255,77,77,0.4);
  }

  .pulse {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }

  #status-pill.live .pulse {
    background: var(--accent);
    animation: blink 1.4s ease-in-out infinite;
  }

  #status-pill.error .pulse { background: var(--danger); }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* MAP */
  #map {
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  /* BOTTOM PANEL */
  #panel {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #coords-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  #coords {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #ping-meta {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
  }

  #history {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 80px;
    overflow-y: auto;
  }

  .h-row {
    display: flex;
    gap: 10px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    padding: 1px 0;
    border-bottom: 1px solid var(--border);
  }

  .h-row:last-child { border-bottom: none; }
  .h-row .h-time { color: #3d4450; min-width: 64px; }
  .h-row .h-coords { color: var(--muted); }

  #btn-row {
    display: flex;
    gap: 8px;
  }

  button {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 5px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  button:hover {
    border-color: var(--accent-dim);
    color: var(--accent);
    background: rgba(0,229,122,0.05);
  }

  button:active { transform: scale(0.97); }

  /* Leaflet dark overrides */
  .leaflet-tile { filter: brightness(0.75) saturate(0.6); }
  .leaflet-control-zoom a {
    background: var(--surface) !important;
    color: var(--text) !important;
    border-color: var(--border) !important;
  }
  .leaflet-control-attribution {
    background: rgba(10,12,15,0.7) !important;
    color: var(--muted) !important;
    font-size: 9px !important;
  }
  .leaflet-control-attribution a { color: var(--muted) !important; }

  /* Custom marker popup */
  .leaflet-popup-content-wrapper {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
  }
  .leaflet-popup-tip { background: var(--surface); }
  .leaflet-popup-content { margin: 8px 12px; }

  /* Scrollbar */
  #history::-webkit-scrollbar { width: 3px; }
  #history::-webkit-scrollbar-track { background: transparent; }
  #history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 180px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--accent);
    color: #000;
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">loco<span>·map</span></div>
    <div id="status-pill">
      <div class="pulse"></div>
      <span id="status-text">connecting</span>
    </div>
  </header>

  <div id="map"></div>

  <div id="panel">
    <div id="coords-row">
      <div id="coords">— awaiting ping —</div>
      <div id="ping-meta"></div>
    </div>
    <div id="history"></div>
    <div id="btn-row">
      <button onclick="fitTrail()">fit trail</button>
      <button onclick="copyCoords()">copy coords</button>
      <button onclick="openOsmand()">open in osmand</button>
      <button onclick="clearTrail()">clear</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TOPIC = "chaoistaoist-loco";
const NTFY_BASE = "https://ntfy.sh";

const map = L.map('map', { zoomControl: true }).setView([43.93, -75.94], 13);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

let points = [];
let historyItems = [];
let dotMarkers = [];
let latestMarker = null;
let latestCoords = null;
let latestOsmandUrl = null;
let pingCount = 0;

const polyline = L.polyline([], {
  color: '#00e57a',
  weight: 2.5,
  opacity: 0.85,
  dashArray: null
}).addTo(map);

const statusPill = document.getElementById('status-pill');
const statusText = document.getElementById('status-text');
const coordsEl = document.getElementById('coords');
const pingMetaEl = document.getElementById('ping-meta');
const historyEl = document.getElementById('history');
const toast = document.getElementById('toast');

function setStatus(state, label) {
  statusPill.className = '';
  if (state) statusPill.classList.add(state);
  statusText.textContent = label;
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

function parseCoords(text) {
  if (!text) return null;
  // OsmAnd pin= format
  const pin = text.match(/[?&]pin=([-\d.]+),([-\d.]+)/);
  if (pin) return { lat: parseFloat(pin[1]), lon: parseFloat(pin[2]) };
  // OsmAnd hash format
  const hash = text.match(/#[\d.]+\/([-\d.]+)\/([-\d.]+)/);
  if (hash) return { lat: parseFloat(hash[1]), lon: parseFloat(hash[2]) };
  // bare lat,lon
  const bare = text.match(/([-\d.]{4,})[,\s]+([-\d.]{4,})/);
  if (bare) {
    const a = parseFloat(bare[1]), b = parseFloat(bare[2]);
    if (a >= -90 && a <= 90 && b >= -180 && b <= 180) return { lat: a, lon: b };
  }
  return null;
}

function fmtTime(ts) {
  const d = ts ? new Date(ts * 1000) : new Date();
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function fmtCoords(lat, lon) {
  return `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
}

function addPing(coords, timeStr, rawMsg) {
  pingCount++;
  latestCoords = coords;
  latestOsmandUrl = rawMsg.match(/https?:\/\/\S+/) ? rawMsg.match(/https?:\/\/\S+/)[0] : null;

  coordsEl.textContent = fmtCoords(coords.lat, coords.lon);
  pingMetaEl.textContent = `#${pingCount} · ${timeStr}`;

  points.push([coords.lat, coords.lon]);
  polyline.setLatLngs(points);

  // remove old latest marker
  if (latestMarker) map.removeLayer(latestMarker);

  // redraw trail dots
  dotMarkers.forEach(m => map.removeLayer(m));
  dotMarkers = [];
  points.slice(0, -1).forEach(p => {
    const m = L.circleMarker(p, {
      radius: 3,
      color: '#00994f',
      fillColor: '#00994f',
      fillOpacity: 0.5,
      weight: 0
    }).addTo(map);
    dotMarkers.push(m);
  });

  // latest = bigger green dot
  latestMarker = L.circleMarker([coords.lat, coords.lon], {
    radius: 7,
    color: '#00e57a',
    fillColor: '#00e57a',
    fillOpacity: 1,
    weight: 2
  }).addTo(map).bindPopup(`<b>${timeStr}</b><br>${fmtCoords(coords.lat, coords.lon)}`);

  map.panTo([coords.lat, coords.lon]);

  // history
  historyItems.unshift({ time: timeStr, lat: coords.lat, lon: coords.lon });
  if (historyItems.length > 30) historyItems.pop();
  renderHistory();
}

function renderHistory() {
  historyEl.innerHTML = '';
  historyItems.forEach(item => {
    const row = document.createElement('div');
    row.className = 'h-row';
    row.innerHTML = `<span class="h-time">${item.time}</span><span class="h-coords">${fmtCoords(item.lat, item.lon)}</span>`;
    historyEl.appendChild(row);
  });
}

function fitTrail() {
  if (points.length > 0) {
    map.fitBounds(L.polyline(points).getBounds(), { padding: [40, 40] });
  }
}

function copyCoords() {
  if (!latestCoords) return;
  const txt = fmtCoords(latestCoords.lat, latestCoords.lon);
  navigator.clipboard.writeText(txt).then(() => showToast('copied!')).catch(() => showToast(txt));
}

function openOsmand() {
  if (!latestCoords) return;
  const url = latestOsmandUrl || `https://osmand.net/map?pin=${latestCoords.lat},${latestCoords.lon}#15/${latestCoords.lat}/${latestCoords.lon}`;
  window.open(url, '_blank');
}

function clearTrail() {
  points = [];
  historyItems = [];
  pingCount = 0;
  latestCoords = null;
  latestOsmandUrl = null;
  polyline.setLatLngs([]);
  dotMarkers.forEach(m => map.removeLayer(m));
  dotMarkers = [];
  if (latestMarker) { map.removeLayer(latestMarker); latestMarker = null; }
  coordsEl.textContent = '— awaiting ping —';
  pingMetaEl.textContent = '';
  historyEl.innerHTML = '';
}

let es;
function connect() {
  if (es) es.close();
  setStatus('', 'connecting');
  es = new EventSource(`${NTFY_BASE}/${TOPIC}/sse`);

  es.onopen = () => setStatus('live', 'live');

  es.addEventListener('message', e => {
    try {
      const data = JSON.parse(e.data);
      const msg = data.message || '';
      const coords = parseCoords(msg);
      if (coords) addPing(coords, fmtTime(data.time), msg);
    } catch(err) {}
  });

  es.onerror = () => {
    setStatus('error', 'reconnecting');
    es.close();
    setTimeout(connect, 5000);
  };
}

async function loadLastPing() {
  try {
    const res = await fetch(`${NTFY_BASE}/${TOPIC}/json?poll=1&since=24h`);
    if (!res.ok) return;
    const text = await res.text();
    const lines = text.trim().split('\n').filter(Boolean);
    if (lines.length === 0) return;
    const data = JSON.parse(lines[lines.length - 1]);
    const msg = data.message || '';
    const coords = parseCoords(msg);
    if (coords) addPing(coords, fmtTime(data.time), msg);
  } catch(e) {}
}

loadLastPing().then(() => connect());
</script>
</body>
</html>
